name: iOS Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device_key:
        description: "Device key from devices.yaml"
        required: false
        default: "simulator"

env:
  PLATFORM: ios
  DEVICE_KEY: ${{ github.event.inputs.device_key || 'simulator' }}

jobs:
  ios-test:
    # iOS tests must run on macOS (Xcode + Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: Update simulator UDID in devices.yaml
        run: |
          python3 - <<'EOF'
          import yaml, os
          path = "config/devices.yaml"
          with open(path) as f:
              data = yaml.safe_load(f)
          data["ios"]["simulator"]["udid"] = os.environ["SIM_UDID"]
          with open(path, "w") as f:
              yaml.dump(data, f, default_flow_style=False)
          EOF

      - name: Start Appium server
        run: |
          npm install -g appium
          appium driver install xcuitest
          appium &
          sleep 5

      - name: Run tests
        run: |
          uv run pytest step_defs/ \
            --platform ios \
            --device-key simulator \
            --html=reports/report.html \
            --self-contained-html \
            -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report
          path: reports/
          retention-days: 14
